[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "looks"
version = "0.0.5"
description = "A facade over video stylization: named effects with licence tiers"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = []
license = "MIT"
license-files = ["LICENSE"]
dependencies = []


[project.urls]
Homepage = "https://github.com/thorwhalen/looks"
Repository = "https://github.com/thorwhalen/looks"
Documentation = "https://thorwhalen.github.io/looks"

[project.scripts]
looks = "looks.cli:main"

[project.optional-dependencies]
# `cw` (MIT, dependencies = []) turns the command table into an argparse parser.
# An EXTRA and not a dependency: `import looks` must stay stdlib-only, so the
# library cannot require its own CLI. Verified 2026-09-02 that `import cw` pulls
# in nothing beyond stdlib — its argcomplete/i2 imports are lazy.
cli = [
    "cw",
]
dev = [
    "cw",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    # ruff >= 0.16 formats Python inside Markdown fences. `docs/` holds prose
    # research notes whose code blocks are ILLUSTRATIVE — reformatting them is
    # pure churn, and CI's publish job runs `ruff format .` and commits the
    # result, so without this the notes get rewritten on every release.
    "docs",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "looks",
]
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]
addopts = "--doctest-modules"

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
